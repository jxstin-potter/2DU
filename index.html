<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="2DU Task Management - A simple and elegant task management application"
    />
    <!-- The app renders dark in both schemes, so one theme-color covers both.
         Value is colors.brand.black from src/styles/theme.ts - keep in sync. -->
    <meta name="theme-color" content="#0F1419" />
    <!-- Switzer carries the UI, Geist Mono the labels and numerals. Only 400
         and 500 are requested: the type system caps weight at 500 on purpose
         (see src/styles/theme.ts), so pulling 600+ would only invite misuse. -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f%5B%5D=switzer@400,500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="/manifest.json" />
    <!-- Vite rewrites href on rel="icon"/"manifest" for the base path but not
         on apple-touch-icon, so this one interpolates %BASE_URL% itself. -->
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192x192.png" />
    <title>2DU Task Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
